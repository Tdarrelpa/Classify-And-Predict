services:
  naive-bayes-model:
    working_dir: /app
    volumes:
      - ./Simple-Naive-Bayes-Multinomial.py:/app/Simple-Naive-Bayes-Multinomial.py
      - ./combined_clickid.csv:/app/combined_clickid.csv # Store the combined CSV
      - ./naive_bayes_model.csv:/app/naive_bayes_model.csv # store the Naive Bayes result
      - ./predictions.csv:/app/predictions.csv # Store the prediction result
    build:
      context: .
      dockerfile: DOCKERFILE
    image: tdarrelpa/nbm-classify-and-predict:latest
    container_name: python-classify-and-predict
    command: python Simple-Naive-Bayes-Multinomial.py