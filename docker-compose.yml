services:
  naive-bayes-model:
    working_dir: /
    volumes:
      - ./Simple-Naive-Bayes-Multinomial.py:/Simple-Naive-Bayes-Multinomial.py
      - ./dataClickId:/dataClickId # Directory contain CSV to be combined
      - ./combined_clickid.csv:/combined_clickid.csv # Store the combined CSV
      - ./naive_bayes_model.csv:/naive_bayes_model.csv # store the Naive Bayes result
      - ./predictions.csv:/predictions.csv # Store the prediction result
    build:
      context: .
    image: tdarrelpa/nbm-classify-and-predict:latest
    container_name: python-classify-and-predict
    command: python /Simple-Naive-Bayes-Multinomial.py