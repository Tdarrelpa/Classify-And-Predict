services:
  naive-bayes-model:
    working_dir: /app
    volumes:
      - ./app/Simple-Naive-Bayes-Multinomial.lsp:/app/Simple-Naive-Bayes-Multinomial.lsp
      - ./dataClickId:/app/dataClickId # Directory contain CSV to be combined
      - ./combined_clickid.csv:/app/combined_clickid.csv # Store the combined CSV
      - ./naive_bayes_model.csv:/app/naive_bayes_model.csv # store the Naive Bayes result
      - ./predictions.csv:/app/predictions.csv # Store the prediction result
    build:
      context: .
    image: tdarrelpa/nbm-classify-and-predict:latest
    container_name: common-lisp-classify-and-predict
    command: sbcl --load Simple-Naive-Bayes-Multinomial.lsp