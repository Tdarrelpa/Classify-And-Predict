stages:
  - build-and-run

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_DRIVER: overlay2

build-and-run-job:
  stage: build-and-run
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache docker-compose
  script:
    - docker-compose up --build --abort-on-container-exit
  after_script:
    - docker logs common-lisp-classify-and-predict || true